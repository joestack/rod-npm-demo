# The "params" section includes the configuration of a single Git repository to be scanned.
# Schema reference: https://docs.jfrog.com/security/docs/the-frogbot-config-yml-file-structure
- params:
    # Git parameters
    git:
      # [Mandatory]
      repoName: rod-npm-demo

      # [Mandatory]
      branches:
        - main

      # [Optional] Templates for the branch/commit/PR generated by Frogbot when opening auto-fix PRs.
      # branchNameTemplate must include ${BRANCH_NAME_HASH} to guarantee a unique branch name.
      branchNameTemplate: "frogbot-${IMPACTED_PACKAGE}-${BRANCH_NAME_HASH}"
      commitMessageTemplate: "Upgrade ${IMPACTED_PACKAGE} to ${FIX_VERSION}"
      pullRequestTitleTemplate: "[🐸 Frogbot] Upgrade ${IMPACTED_PACKAGE} to ${FIX_VERSION}"

      # [Optional, Default: false]
      # true = one aggregated PR with all fixes. false = one PR per fix.
      aggregateFixes: true

    # Frogbot scanning parameters
    scan:
      # Single project, scanned from the repository root.
      projects:
        # [Default: root directory] Listed explicitly per this repo's setup.
        # V3's static SCA engine reads the manifest directly - no installCommand needed.
        - workingDirs:
            - "."

    # JFrog Platform parameters
    jfrogPlatform:
      # [Optional] jfrogProjectKey: ""
      # [Optional] watches: []

# -----------------------------------------------------------------------------------------------
# Scanner enablement (SCA / SAST / Secrets / Snippet Detection) is NOT configured in this file.
#
# In Frogbot V3, these live in a Config Profile on the JFrog Platform, matched to this repo by its
# Git clone URL (https://github.com/joestack/rod-npm-demo.git) - see utils/getconfiguration.go in
# jfrog/frogbot. Frogbot looks the profile up automatically at scan time; there is no env var or
# frogbot-config.yml key that turns scanners on or off.
#
# Verified live against this repo's clone URL (POST /xray/api/v1/xsc/profile_repos): no repo-
# specific profile exists, so Frogbot resolves to the platform's "System_Default_Profile", which
# already has:
#   scan_config.sca_scanner_config.enable_sca_scan:            true
#   scan_config.sca_scanner_config.enable_snippet_detection:    false  <- Snippet Detection, add later
#   scan_config.sast_scanner_config.enable_sast_scan:           true
#   scan_config.secrets_scanner_config.enable_secrets_scan:     true
#   scan_config.iac_scanner_config.enable_iac_scan:             true
#   scan_config.contextual_analysis_scanner_config.enable_ca_scan: true
#
# This already matches what we want (SCA/SAST/Secrets on, Snippet Detection off) - no repo-specific
# Config Profile needs to be created. See .frogbot/SETUP.md for how to verify this yourself, and for
# where Snippet Detection would later be switched on if a repo-specific profile is created.
# -----------------------------------------------------------------------------------------------
